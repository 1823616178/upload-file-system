version: '3.8'

services:
  hanvonfile:
    container_name: hanvonfile
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - FTP_HOST=${FTP_HOST}
      - FTP_USER=${FTP_USER}
      - FTP_PASSWORD=${FTP_PASSWORD}
      - FTP_PORT=${FTP_PORT}
      - FTP_SECURE=${FTP_SECURE}
      - FTP_BASE_PATH=${FTP_BASE_PATH}
      - SSH_HOST=${SSH_HOST}
      - SSH_USER=${SSH_USER}
      - SSH_PASSWORD=${SSH_PASSWORD}
      - SSH_PORT=${SSH_PORT}
      - SSH_POWER_PASSWORD=${SSH_POWER_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge